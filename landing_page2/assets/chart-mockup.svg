<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Abstract trading chart mockup -->
  <defs>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e87b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e87b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" rx="24" fill="#fff" fill-opacity="0.6"/>
  <rect x="1" y="1" width="598" height="398" rx="23" fill="none" stroke="#000" stroke-opacity="0.06"/>
  <!-- Grid lines -->
  <g stroke="#000" stroke-opacity="0.04" stroke-width="1">
    <line x1="60" y1="60" x2="560" y2="60"/>
    <line x1="60" y1="120" x2="560" y2="120"/>
    <line x1="60" y1="180" x2="560" y2="180"/>
    <line x1="60" y1="240" x2="560" y2="240"/>
    <line x1="60" y1="300" x2="560" y2="300"/>
  </g>
  <!-- Price labels -->
  <g fill="#999" font-family="Inter,sans-serif" font-size="10">
    <text x="30" y="64">85,200</text>
    <text x="30" y="124">82,400</text>
    <text x="30" y="184">79,600</text>
    <text x="30" y="244">76,800</text>
    <text x="30" y="304">74,000</text>
  </g>
  <!-- Candlesticks -->
  <g>
    <!-- Green candles (up) -->
    <line x1="100" y1="180" x2="100" y2="100" stroke="#00e87b" stroke-width="1.5"/>
    <rect x="94" y="120" width="12" height="40" rx="2" fill="#00e87b"/>
    
    <line x1="140" y1="200" x2="140" y2="110" stroke="#00e87b" stroke-width="1.5"/>
    <rect x="134" y="130" width="12" height="50" rx="2" fill="#00e87b"/>
    
    <line x1="220" y1="190" x2="220" y2="80" stroke="#00e87b" stroke-width="1.5"/>
    <rect x="214" y="100" width="12" height="60" rx="2" fill="#00e87b"/>
    
    <line x1="300" y1="150" x2="300" y2="60" stroke="#00e87b" stroke-width="1.5"/>
    <rect x="294" y="80" width="12" height="45" rx="2" fill="#00e87b"/>
    
    <line x1="380" y1="160" x2="380" y2="70" stroke="#00e87b" stroke-width="1.5"/>
    <rect x="374" y="90" width="12" height="40" rx="2" fill="#00e87b"/>
    
    <line x1="460" y1="120" x2="460" y2="50" stroke="#00e87b" stroke-width="1.5"/>
    <rect x="454" y="60" width="12" height="40" rx="2" fill="#00e87b"/>
    
    <line x1="500" y1="100" x2="500" y2="40" stroke="#00e87b" stroke-width="1.5"/>
    <rect x="494" y="50" width="12" height="30" rx="2" fill="#00e87b"/>
    
    <!-- Red candles (down) -->
    <line x1="180" y1="220" x2="180" y2="120" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="174" y="140" width="12" height="55" rx="2" fill="#ff4d4d"/>
    
    <line x1="260" y1="180" x2="260" y2="90" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="254" y="100" width="12" height="50" rx="2" fill="#ff4d4d"/>
    
    <line x1="340" y1="170" x2="340" y2="80" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="334" y="95" width="12" height="45" rx="2" fill="#ff4d4d"/>
    
    <line x1="420" y1="140" x2="420" y2="60" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="414" y="75" width="12" height="35" rx="2" fill="#ff4d4d"/>
    
    <line x1="540" y1="110" x2="540" y2="30" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="534" y="45" width="12" height="40" rx="2" fill="#ff4d4d"/>
  </g>
  <!-- Area fill under trend line -->
  <path d="M94,140 L134,155 L174,168 L214,120 L254,125 L294,100 L334,115 L374,105 L414,90 L454,75 L494,60 L534,55 L560,55 L560,340 L60,340 Z" fill="url(#chartGrad)"/>
  <!-- Trend line -->
  <polyline points="94,140 134,155 174,168 214,120 254,125 294,100 334,115 374,105 414,90 454,75 494,60 534,55" fill="none" stroke="#00e87b" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Current price dot -->
  <circle cx="534" cy="55" r="5" fill="#00e87b" filter="url(#glow)"/>
  <circle cx="534" cy="55" r="8" fill="none" stroke="#00e87b" stroke-opacity="0.3" stroke-width="2"/>
  <!-- Bottom bar -->
  <rect x="60" y="340" width="500" height="40" rx="0" fill="#f3f4f6"/>
  <g fill="#999" font-family="Inter,sans-serif" font-size="10">
    <text x="80" y="365">BTC/cNGN</text>
    <text x="200" y="365" fill="#00e87b">+6.42%</text>
    <text x="300" y="365">Vol: ₦2.4B</text>
    <text x="430" y="365">24h High: ₦85,200</text>
  </g>
</svg>