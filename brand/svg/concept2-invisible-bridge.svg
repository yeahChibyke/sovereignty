<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="48" fill="#0A0A0A"/>
  
  <!-- Concept 2: The Invisible Bridge -->
  <!-- A single square/frame that's been split vertically and offset. -->
  <!-- The left half drops down, the right half lifts up - creating a staggered break. -->
  <!-- Two thin horizontal lines bridge the gap = the invisible connection (Naira crossbars). -->
  <g transform="translate(256, 256)">
    <!-- Left half of broken frame (shifted down) -->
    <path d="
      M-140,-120 L-10,-120 L-10,-80 L-100,-80 L-100,140 L-140,140 Z
    " fill="#00C853"/>
    <!-- Left bottom bar -->
    <path d="M-140,100 L-10,100 L-10,140 L-140,140 Z" fill="#00C853"/>
    
    <!-- Right half of broken frame (shifted up) -->
    <path d="
      M10,-140 L140,-140 L140,120 L10,120 L10,80 L100,80 L100,-140
    " fill="#00C853"/>
    <!-- Right top bar -->
    <path d="M10,-140 L140,-140 L140,-100 L10,-100 Z" fill="#00C853"/>
    
    <!-- Bridge lines (Naira crossbars spanning the void) -->
    <rect x="-10" y="-25" width="20" height="4" fill="#00C853" opacity="0.6"/>
    <rect x="-10" y="20" width="20" height="4" fill="#00C853" opacity="0.6"/>
  </g>
</svg>