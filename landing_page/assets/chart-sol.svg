  <!-- Area fill -->
  <path d="M94,205 L134,175 L174,185 L214,150 L254,115 L294,122 L334,92 L374,98 L414,76 L454,68 L494,58 L534,48 L560,48 L560,340 L60,340 Z" fill="url(#solGrad)"/>
