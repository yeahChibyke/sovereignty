<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="solGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9945ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9945ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="solGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" rx="24" fill="#fff" fill-opacity="0.6"/>
  <rect x="1" y="1" width="598" height="398" rx="23" fill="none" stroke="#000" stroke-opacity="0.06"/>
  <!-- Grid -->
