  <polyline points="94,205 134,175 174,185 214,150 254,115 294,122 334,92 374,98 414,76 454,68 494,58 534,48" fill="none" stroke="#9945ff" stroke-width="2.5" filter="url(#solGlow)"/>
  <!-- Current price dot -->
  <circle cx="534" cy="48" r="5" fill="#9945ff" filter="url(#solGlow)"/>
