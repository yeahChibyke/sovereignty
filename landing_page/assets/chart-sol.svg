    <line x1="220" y1="200" x2="220" y2="110" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="214" y="125" width="12" height="50" rx="2" fill="#ff4d4d"/>

    <line x1="300" y1="170" x2="300" y2="90" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="294" y="100" width="12" height="45" rx="2" fill="#ff4d4d"/>

    <line x1="380" y1="145" x2="380" y2="65" stroke="#ff4d4d" stroke-width="1.5"/>
