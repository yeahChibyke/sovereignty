  <!-- Area fill -->
  <path d="M94,160 L134,172 L174,130 L214,135 L254,105 L294,116 L334,130 L374,108 L414,100 L454,82 L494,78 L534,65 L560,65 L560,340 L60,340 Z" fill="url(#ethGrad)"/>
  <!-- Trend line -->
  <polyline points="94,160 134,172 174,130 214,135 254,105 294,116 334,130 374,108 414,100 454,82 494,78 534,65" fill="none" stroke="#627eea" stroke-width="2.5" filter="url(#ethGlow)"/>
  <!-- Current price dot -->
  <circle cx="534" cy="65" r="5" fill="#627eea" filter="url(#ethGlow)"/>
  <circle cx="534" cy="65" r="8" fill="none" stroke="#627eea" stroke-opacity="0.3" stroke-width="2"/>
