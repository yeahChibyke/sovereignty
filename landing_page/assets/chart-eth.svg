    <rect x="94" y="145" width="12" height="35" rx="2" fill="#627eea"/>

    <line x1="180" y1="170" x2="180" y2="90" stroke="#627eea" stroke-width="1.5"/>
    <rect x="174" y="110" width="12" height="40" rx="2" fill="#627eea"/>

    <line x1="260" y1="150" x2="260" y2="70" stroke="#627eea" stroke-width="1.5"/>
    <rect x="254" y="85" width="12" height="45" rx="2" fill="#627eea"/>

    <line x1="340" y1="180" x2="340" y2="100" stroke="#627eea" stroke-width="1.5"/>
    <rect x="334" y="115" width="12" height="38" rx="2" fill="#627eea"/>

    <line x1="460" y1="130" x2="460" y2="55" stroke="#627eea" stroke-width="1.5"/>
    <rect x="454" y="65" width="12" height="42" rx="2" fill="#627eea"/>

    <line x1="540" y1="110" x2="540" y2="45" stroke="#627eea" stroke-width="1.5"/>
    <rect x="534" y="55" width="12" height="30" rx="2" fill="#627eea"/>

    <!-- Red candles -->
    <line x1="140" y1="210" x2="140" y2="140" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="134" y="155" width="12" height="38" rx="2" fill="#ff4d4d"/>

    <line x1="220" y1="175" x2="220" y2="100" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="214" y="115" width="12" height="40" rx="2" fill="#ff4d4d"/>

    <line x1="300" y1="160" x2="300" y2="85" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="294" y="95" width="12" height="42" rx="2" fill="#ff4d4d"/>

    <line x1="380" y1="155" x2="380" y2="80" stroke="#ff4d4d" stroke-width="1.5"/>
    <rect x="374" y="92" width="12" height="36" rx="2" fill="#ff4d4d"/>

    <line x1="420" y1="145" x2="420" y2="70" stroke="#ff4d4d" stroke-width="1.5"/>
