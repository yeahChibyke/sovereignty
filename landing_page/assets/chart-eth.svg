  <g fill="#999" font-family="Inter,sans-serif" font-size="10">
    <text x="80" y="365">ETH/cNGN</text>
    <text x="200" y="365" fill="#627eea">+4.18%</text>
    <text x="300" y="365">Vol: ₦1.8B</text>
