<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="ethGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#627eea" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#627eea" stop-opacity="0"/>
    </linearGradient>
    <filter id="ethGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" rx="24" fill="#fff" fill-opacity="0.6"/>
  <rect x="1" y="1" width="598" height="398" rx="23" fill="none" stroke="#000" stroke-opacity="0.06"/>
  <!-- Grid -->
  <g stroke="#000" stroke-opacity="0.04" stroke-width="1">
    <line x1="60" y1="60" x2="560" y2="60"/>
    <line x1="60" y1="120" x2="560" y2="120"/>
    <line x1="60" y1="180" x2="560" y2="180"/>
    <line x1="60" y1="240" x2="560" y2="240"/>
    <line x1="60" y1="300" x2="560" y2="300"/>
  </g>
  <!-- Price labels -->
  <g fill="#999" font-family="Inter,sans-serif" font-size="10">
